name: Snapshot History Release Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/snapshot-history-v1 ]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dependency check
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q -f -x '(__pycache__|BACKUP|\.git)' .
      - name: Snapshot unit and adversarial tests
        run: python -m unittest -v test_snapshot_history.py
      - name: Existing SIS regression tests
        run: |
          python -m unittest -v test_sis_engine.py
          python -m unittest -v test_stage2_engine.py
